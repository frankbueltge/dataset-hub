name: Nächtliche Ernte

# Deterministisch, ohne Modellbeteiligung (Bauregel: kein Modell-API-Aufruf in der
# Pipeline). Urteilsschritte laufen getrennt als Claude-Code-Routine unter dem Abo.

# PAUSIERT am 2026-07-27 (Frank). Der nächtliche Cron ("20 3 * * *") ist ausgesetzt, weil
# der Rückbau des Registers (frankbueltge.de → docs/design/2026-07-27-register-rueckbau-
# und-scouts.md) den Bestand von der Website genommen hat: Die Ernte füllte einen
# Steinbruch, den niemand mehr anzeigt, und die künftigen Scouts fragen Quellen GEZIELT ab
# statt in Bulk. Was da ist, reicht als Steinbruch und Messbeleg.
#
# Wiedereinschalten = die beiden Zeilen unter `schedule:` entkommentieren. Der Lauf bleibt
# derweil per `workflow_dispatch` von Hand startbar — pausiert, nicht abgebaut.
#
# ACHTUNG beim Wiedereinschalten (Falle §9.3 der Design-Notiz): Der nächtliche Lauf holt
# seine Rohernten aus dem JÜNGSTEN Release. Ein zwischenzeitlich von Hand veröffentlichtes
# Release ohne die Ernten des Tages lässt diese dauerhaft aus allen künftigen Bauten fallen.
on:
  # schedule:
  #   - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      seit:
        description: "Startzeitpunkt des Erntefensters (ISO, UTC). Leer = letzte 24 h."
        required: false
      budget:
        description: "Anzahl Zugriffswege, die aufgelöst werden"
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  ernte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bisherige Rohernten aus dem letzten Release zurückholen
        # Die Rohernten liegen NICHT in Git (zu groß), sondern als Release-Assets. Ohne
        # diesen Schritt sieht der Lauf auf GitHubs Rechner nur seine eigene frische
        # Ernte und ERSETZT den Bestand, statt ihn zu ergänzen — am 27.07. schrumpfte er
        # so von 17.327 auf 12.915 Einträge. Fehlschlag ist hier kein Beinbruch, aber er
        # wird vermerkt: der Snapshot weist danach selbst aus, welche Erntefenster fehlen.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p fundstellen
          VORHER=$(gh release list --limit 20 --json tagName --jq \
            '[.[] | select(.tagName | startswith("snapshot-"))] | sort_by(.tagName) | reverse | .[0].tagName')
          if [ -z "$VORHER" ]; then
            echo "::warning::Kein früheres Snapshot-Release — der Bestand beginnt bei dieser Ernte."
          else
            echo "Hole Rohernten aus $VORHER"
            gh release download "$VORHER" --pattern '*.jsonl.gz' --dir fundstellen --clobber \
              || echo "::warning::Rohernten aus $VORHER nicht ladbar — der Bestand wird unvollständig gebaut und weist das im Manifest aus."
            ls -1 fundstellen/*.jsonl.gz 2>/dev/null | wc -l | xargs echo "  zurückgeholte Rohernten:"
          fi

      - name: Ernte (inkrementell)
        working-directory: pipeline
        run: |
          if [ -n "${{ inputs.seit }}" ]; then
            python3 ernte_datacite.py --seit "${{ inputs.seit }}"
          else
            python3 ernte_datacite.py
          fi

      - name: Zugriffswege auflösen (Budget)
        working-directory: pipeline
        run: python3 aufloese.py --budget "${{ inputs.budget || 500 }}"

      - name: Bestand bauen
        working-directory: pipeline
        run: python3 baue_bestand.py

      - name: Tests
        run: python3 -m unittest discover -s pipeline/tests

      - name: Oberflächendaten erzeugen
        # Muss VOR dem Snapshot laufen: baue_snapshot.py nimmt die erzeugten Dateien
        # als Release-Assets mit, aus denen frankbueltge.de beim Bauen liest. Fehlt
        # dieser Schritt, veröffentlicht der Snapshot den Stand von gestern.
        working-directory: oberflaeche
        run: python3 generiere_index.py

      - name: Snapshot bauen
        working-directory: pipeline
        run: python3 baue_snapshot.py

      - name: Register, Manifeste und Prüfungen committen
        run: |
          git config user.name "Dataset-Hub"
          git config user.email "hub@dataset-hub.invalid"
          git add fundstellen/manifeste register pruefungen snapshots/*.json journal || true
          if git diff --cached --quiet; then
            echo "nichts zu committen"
          else
            git commit -m "chore(nightly): Ernte, Auflösungen, Register und Snapshot-Manifest"
            git push
          fi

      - name: Snapshot veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="snapshot-$(date -u +%Y-%m-%d)"
          MANIFEST="snapshots/$TAG.manifest.json"
          # Assets: Bestand + alle Rohernten dieses Laufs
          FILES=$(python3 -c "
          import json, pathlib
          m = json.load(open('$MANIFEST'))
          for a in m['assets']:
              for basis in ('snapshots/build', 'fundstellen'):
                  p = pathlib.Path(basis) / a['name']
                  if p.exists():
                      print(p)
          ")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "Snapshot $TAG" \
              --notes-file "$MANIFEST"
          fi

      - name: Site über den neuen Stand benachrichtigen
        # Ohne diesen Anstoß baut frankbueltge.de erst beim nächsten eigenen Push neu
        # und zeigt so lange einen älteren Registerstand. Fehlt das Token, wird das
        # vermerkt statt still übergangen.
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN fehlt — die Site wurde NICHT neu gebaut und zeigt weiter den vorherigen Registerstand."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/frankbueltge/frankbueltge.de/dispatches \
            -d '{"event_type":"dataset-snapshot"}' \
            -w "  Dispatch-Status: %{http_code}\n"
